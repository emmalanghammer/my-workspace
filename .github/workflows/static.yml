# Deploys the site to GitHub Pages.
#
# Two things are published from one artifact, so both are always live and
# always in step:
#
#   /          the `main` branch  — the site everyone has the link to
#   /preview/  the `original-workspace` branch — the version being reviewed
#
# A push to either branch rebuilds both, so the preview is never stale and
# main is never surprised. Changing which version is "the" site is one line:
# swap the two branch names in the checkout steps below.
name: Deploy static content to Pages

on:
  push:
    branches: ["main", "original-workspace"]

  # Lets you re-run a deploy by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the live site (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Check out the preview (original-workspace)
        uses: actions/checkout@v4
        with:
          ref: original-workspace
          path: preview

      - name: Assemble
        run: |
          rm -rf site/.git preview/.git preview/.github
          mkdir -p site/preview
          cp -R preview/. site/preview/
          echo "--- published at / ---"
          ls site
          echo "--- published at /preview/ ---"
          ls site/preview

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
