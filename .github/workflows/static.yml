# Deploys the site to GitHub Pages.
#
# Two things are published from one artifact, so both are always live and
# always in step:
#
#   /          the `main` branch  — the site everyone has the link to
#   /preview/  the `original-workspace` branch — the version being reviewed
#
# Only `main` can trigger this. GitHub's `github-pages` environment refuses a
# deployment from any other branch, so a push to `original-workspace` fails
# before it runs a step -- the preview is refreshed by a push to main, or by
# running this workflow by hand from the Actions tab (Run workflow), which
# always re-reads both branches.
#
# Changing which version is "the" site is one line: swap the two branch names
# in the checkout steps below.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]

  # Refreshes the preview after a push to original-workspace.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the live site (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Check out the preview (original-workspace)
        uses: actions/checkout@v4
        with:
          ref: original-workspace
          path: preview

      - name: Assemble
        run: |
          rm -rf site/.git preview/.git preview/.github
          mkdir -p site/preview
          cp -R preview/. site/preview/
          echo "--- published at / ---"
          ls site
          echo "--- published at /preview/ ---"
          ls site/preview

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
