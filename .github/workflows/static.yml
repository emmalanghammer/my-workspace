# Deploys the site to GitHub Pages.
#
# Two things are published from one artifact, so both are always live and
# always in step:
#
#   /          the `main` branch — the site everyone has the link to, now the
#              production My Workspace UI
#   /preview/  the `v1-tasks-tile` tag — the earlier version, the one with the
#              My Tasks tile on the Workspace, kept openable rather than only
#              recoverable
#
# Only `main` can trigger this. GitHub's `github-pages` environment refuses a
# deployment from any other branch, so the archive is republished whenever main
# deploys, or by running this workflow by hand from the Actions tab.
#
# Changing which version is "the" site is one line: swap the two refs in the
# checkout steps below.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]

  # Republishes both by hand, without waiting for a push.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the live site (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Check out the archived version (v1-tasks-tile)
        uses: actions/checkout@v4
        with:
          ref: v1-tasks-tile
          path: preview

      - name: Assemble
        run: |
          rm -rf site/.git preview/.git preview/.github
          mkdir -p site/preview
          cp -R preview/. site/preview/
          echo "--- published at / ---"
          ls site
          echo "--- published at /preview/ ---"
          ls site/preview

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
